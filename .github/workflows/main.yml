name: Python unittests

on:
  push:
    branches: [ "master", "tests" ]

permissions:
  contents: read

jobs:
  build_and_test:
    strategy: 
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Test with unittest
      run: python -m unittest
